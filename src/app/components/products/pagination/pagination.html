<nav class="pagination" aria-label="Paginación de productos">
  <button type="button" [disabled]="page() === 1" (click)="previous.emit()">Anterior</button>
  <span
    >Página <strong>{{ page() }}</strong> de {{ totalPages() }}</span
  >
  <button type="button" [disabled]="page() === totalPages()" (click)="next.emit()">
    Siguiente
  </button>
</nav>
